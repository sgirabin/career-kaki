<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CareerKaki</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h3>🎯 CareerKaki</h3>

      <div id="inputSection" style="margin-bottom: 16px">
        <textarea id="input" placeholder="Job description will be auto-detected from this page..."></textarea>
        <div class="controls" style="margin-top: 8px">
          <button id="start" style="flex: 1">Start Workflow</button>
          <button id="copyId" disabled style="flex: 0.5">Copy ID</button>
          <button id="approve" disabled style="flex: 0.5">Approve</button>
        </div>
      </div>

      <div id="progressSection" style="display: none; margin-top: 16px">
        <div id="progressTimeline" class="timeline"></div>
      </div>

      <div id="resultsSection" style="display: none; margin-top: 16px">
        <h4>Results</h4>
        <div id="resultDetails"></div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
